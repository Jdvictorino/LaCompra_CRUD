<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Supermercado</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Lista de Compras</h1>
    <!--Seccion donde se agregan los productos-->
    <div class="card">
        <h3>Agregar / Editar Producto</h3>
        <form id="productForm">
            <input type="hidden" id="productId">
            <input type="text" id="name" placeholder="Nombre (ej. Manzanas)" required>
            <input type="number" id="price" step="0.01" placeholder="Precio (ej. 2.50)" required>
            <input type="text" id="category" placeholder="Categoría (ej. Frutas)" required>
            <button type="submit" id="submitBtn">Agregar Producto</button>
        </form>
    </div>
    <!--Tabla donde se muestran los productos-->
    <div class="card">
        <h3>Productos en el Carrito</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productList">
                <!-- Los productos aparecerán aquí -->
            </tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>

</html>
